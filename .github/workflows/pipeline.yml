name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test checked-out source
        run: python -m unittest discover

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build application ZIP
        run: zip -j application.zip app.py duckfine.py requirements.txt smoke.sh
      - name: Upload application ZIP
        uses: actions/upload-artifact@v4
        with:
          name: application-zip
          path: application.zip

  smoke-packaged-zip:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download application ZIP
        uses: actions/download-artifact@v4
        with:
          name: application-zip
          path: downloaded
      - name: Extract application ZIP
        run: unzip downloaded/application.zip -d packaged-app
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install packaged dependencies
        run: python -m pip install -r packaged-app/requirements.txt
      - name: Start packaged application
        run: |
          cd packaged-app
          python app.py > "$RUNNER_TEMP/flask.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/flask.pid"
      - name: Smoke test packaged ZIP
        run: |
          set -euo pipefail
          app_pid=$(cat "$RUNNER_TEMP/flask.pid")
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:5000/health >/dev/null
          BASE_URL=http://127.0.0.1:5000 sh packaged-app/smoke.sh